<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3fc"/>
      <stop offset="1" stop-color="#eee9ff"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182741"/>
      <stop offset="1" stop-color="#1b1c3a"/>
    </linearGradient>
    <linearGradient id="vsLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#1e1b4b" flood-opacity="0.24"/>
    </filter>
    <clipPath id="rightClip">
      <rect x="604" y="184" width="516" height="396" rx="14"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="624" y="292" width="476" height="196" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="210" fill="#bae6fd" opacity="0.35"/>
  <circle cx="110" cy="700" r="190" fill="#ddd6fe" opacity="0.45"/>

  <!-- 深色科技风应用窗口 -->
  <g filter="url(#shadow)">
    <rect x="56" y="66" width="1088" height="618" rx="22" fill="#0a0f1e"/>
  </g>
  <rect x="56" y="66" width="1088" height="48" rx="22" fill="#121b30"/>
  <rect x="56" y="96" width="1088" height="20" fill="#121b30"/>
  <circle cx="88" cy="90" r="6" fill="#f87171"/>
  <circle cx="108" cy="90" r="6" fill="#fbbf24"/>
  <circle cx="128" cy="90" r="6" fill="#34d399"/>
  <rect x="162" y="76" width="360" height="28" rx="14" fill="#1b2740"/>
  <text x="182" y="95" font-size="13" fill="#8fa0bd">a2ui.smallyoung.cn</text>
  <rect x="900" y="76" width="100" height="28" rx="8" fill="none" stroke="#22d3ee" stroke-opacity="0.55"/>
  <text x="920" y="95" font-size="12" fill="#67e8f9">历史会话</text>
  <rect x="1010" y="76" width="100" height="28" rx="8" fill="none" stroke="#22d3ee" stroke-opacity="0.55"/>
  <text x="1030" y="95" font-size="12" fill="#67e8f9">模型配置</text>

  <text x="88" y="150" font-size="18" font-weight="700" fill="#e6edf7">A2UI 协议演示</text>
  <text x="252" y="150" font-size="12" fill="#7c8aa5">v0.9+ 协议工作台 · 双模式实时对比</text>
  <rect x="1006" y="130" width="114" height="26" rx="13" fill="#123b3f" stroke="#1a6b6b"/>
  <text x="1022" y="148" font-size="11" fill="#5eead4">免 Key 演示</text>
  <line x1="80" y1="168" x2="1120" y2="168" stroke="#1e2a44"/>

  <!-- 左：标准模式（纯 Markdown） -->
  <rect x="80" y="184" width="500" height="396" rx="14" fill="#101a2d" stroke="#22304d"/>
  <text x="100" y="210" font-size="15" font-weight="700" fill="#cbd5e1">标准模式</text>
  <text x="190" y="210" font-size="11" fill="#7c8aa5">纯 Markdown 渲染</text>
  <line x1="80" y1="224" x2="580" y2="224" stroke="#22304d"/>
  <rect x="330" y="240" width="230" height="38" rx="12" fill="#1e3a5f"/>
  <text x="346" y="264" font-size="12" fill="#dbeafe">帮我看一下服务器状态</text>
  <circle cx="112" cy="296" r="12" fill="#26354f"/>
  <text x="107" y="301" font-size="11" fill="#93c5fd">AI</text>
  <text x="132" y="300" font-size="12" fill="#8fa0bd">以下为当前服务器状态：</text>
  <g font-size="13" fill="#94a3b8">
    <text x="100" y="330">CPU 负载：78.4%</text>
    <text x="100" y="354">内存占用：62.1%</text>
    <text x="100" y="378">请求量：1.2k / min</text>
  </g>
  <text x="100" y="404" font-size="12" fill="#64748b">（纯文本，无法点击或交互）</text>
  <rect x="100" y="428" width="460" height="92" rx="10" fill="none" stroke="#2a3854" stroke-dasharray="6 5"/>
  <text x="252" y="480" font-size="12" fill="#64748b">只有文字 · 没有可交互界面</text>
  <rect x="96" y="536" width="468" height="32" rx="10" fill="#0c1424" stroke="#22304d"/>
  <text x="110" y="557" font-size="11" fill="#64748b">发送独立消息…</text>

  <!-- 右：A2UI 协议模式（结构化组件） -->
  <rect x="604" y="184" width="516" height="396" rx="14" fill="#101a2d" stroke="#3a3260"/>
  <g clip-path="url(#rightClip)">
    <circle cx="1060" cy="210" r="170" fill="#7c3aed" opacity="0.16"/>
    <circle cx="620" cy="570" r="150" fill="#0891b2" opacity="0.1"/>
  </g>
  <text x="624" y="210" font-size="15" font-weight="700" fill="#e9d5ff">A2UI 协议模式</text>
  <text x="762" y="210" font-size="11" fill="#a78bfa">Markdown + A2UI 组件</text>
  <rect x="1000" y="194" width="100" height="24" rx="12" fill="#2e1a4d" stroke="#6d28d9"/>
  <text x="1014" y="211" font-size="11" fill="#c4b5fd">流式渲染中</text>
  <line x1="604" y1="224" x2="1120" y2="224" stroke="#3a3260"/>
  <rect x="850" y="240" width="250" height="38" rx="12" fill="#3b2a63"/>
  <text x="866" y="264" font-size="12" fill="#ede9fe">帮我看一下服务器状态</text>

  <!-- AI 生成的组件卡片 -->
  <rect x="624" y="292" width="476" height="196" rx="14" fill="url(#glass)" stroke="#3b4a72"/>
  <g clip-path="url(#cardClip)">
    <rect x="624" y="292" width="4" height="196" fill="url(#aurora)"/>
    <circle cx="1080" cy="300" r="90" fill="#a855f7" opacity="0.1"/>
  </g>
  <text x="644" y="320" font-size="14" font-weight="700" fill="#e2e8f0">服务器状态监控</text>
  <rect x="1000" y="302" width="80" height="22" rx="11" fill="#134e4a"/>
  <text x="1012" y="317" font-size="11" fill="#5eead4">● 实时</text>

  <g>
    <rect x="644" y="336" width="140" height="94" rx="10" fill="#101b30" stroke="#2a3a5c"/>
    <text x="658" y="358" font-size="11" fill="#8fa0bd">CPU 负载</text>
    <text x="658" y="390" font-size="22" font-weight="700" fill="#22d3ee">78.4%</text>
    <text x="658" y="414" font-size="11" fill="#f87171">↑ 12% 较昨日</text>
    <rect x="796" y="336" width="140" height="94" rx="10" fill="#101b30" stroke="#2a3a5c"/>
    <text x="810" y="358" font-size="11" fill="#8fa0bd">内存占用</text>
    <text x="810" y="390" font-size="22" font-weight="700" fill="#a78bfa">62.1%</text>
    <text x="810" y="414" font-size="11" fill="#34d399">● 运行正常</text>
    <rect x="948" y="336" width="140" height="94" rx="10" fill="#101b30" stroke="#2a3a5c"/>
    <text x="962" y="358" font-size="11" fill="#8fa0bd">请求量</text>
    <text x="962" y="390" font-size="22" font-weight="700" fill="#e2e8f0">1.2k</text>
    <text x="962" y="414" font-size="11" fill="#8fa0bd">次 / min</text>
  </g>
  <rect x="644" y="444" width="110" height="30" rx="9" fill="url(#aurora)"/>
  <text x="666" y="464" font-size="12" font-weight="600" fill="#06121f">查看详情</text>
  <rect x="764" y="444" width="96" height="30" rx="9" fill="none" stroke="#3b4a72"/>
  <text x="784" y="464" font-size="12" fill="#cbd5e1">刷新数据</text>
  <text x="876" y="464" font-size="11" fill="#64748b">Card · Metric · Badge · Button</text>

  <text x="624" y="516" font-size="11" fill="#7c8aa5">JSONL 流式消息</text>
  <g font-size="10" fill="#93c5fd">
    <rect x="624" y="524" width="132" height="26" rx="8" fill="#1a2740" stroke="#33415f"/>
    <text x="634" y="541">createSurface</text>
    <rect x="764" y="524" width="162" height="26" rx="8" fill="#1a2740" stroke="#33415f"/>
    <text x="774" y="541">updateComponents</text>
    <rect x="934" y="524" width="154" height="26" rx="8" fill="#1a2740" stroke="#33415f"/>
    <text x="944" y="541">updateDataModel</text>
  </g>
  <text x="624" y="568" font-size="11" fill="#a78bfa">● 渐进式渲染完成 · 组件可交互</text>

  <!-- 对比分隔 -->
  <line x1="592" y1="184" x2="592" y2="580" stroke="url(#vsLine)" stroke-width="2"/>
  <circle cx="592" cy="382" r="19" fill="#16233c" stroke="#3b4a72"/>
  <text x="581" y="386" font-size="11" font-weight="700" fill="#94a3b8">VS</text>

  <!-- 底部同步输入 -->
  <rect x="80" y="596" width="1040" height="44" rx="12" fill="#121b30" stroke="#24314f"/>
  <text x="100" y="623" font-size="12" fill="#7c8aa5">同步发送给两个聊天框，直观对比纯文本与结构化界面的差异…</text>
  <rect x="1010" y="602" width="94" height="32" rx="9" fill="url(#aurora)"/>
  <text x="1028" y="623" font-size="12" font-weight="700" fill="#06121f">同步发送</text>
</svg>
