  <rect x="700" y="504" width="400" height="40" rx="10" fill="#141720" stroke="#262c3c"/>
  <text x="716" y="529" font-size="13" fill="#e8eaf3">MP3 24kHz · 48kbps（标准推荐）</text>
  <text x="1072" y="529" font-size="13" fill="#8b93a7">▾</text>

  <circle cx="720" cy="582" r="20" fill="url(#accent)"/>
  <path d="M715 573 l13 9 -13 9 z" fill="#ffffff"/>
  <line x1="752" y1="582" x2="1100" y2="582" stroke="#2b3244" stroke-width="6" stroke-linecap="round"/>
  <line x1="752" y1="582" x2="880" y2="582" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="880" cy="582" r="8" fill="#ffffff"/>
  <text x="752" y="608" font-size="12" fill="#6b7488">00:00</text>
  <text x="1064" y="608" font-size="12" fill="#6b7488">00:12</text>

  <rect x="700" y="626" width="400" height="46" rx="12" fill="url(#accent)"/>
  <text x="852" y="655" font-size="16" font-weight="700" fill="#ffffff">生成并播放语音</text>
