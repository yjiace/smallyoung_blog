  <g font-size="13" fill="#c9cede">
    <text x="700" y="326">语速</text><text x="1052" y="326" fill="#8b7cff">1.0x</text>
    <line x1="700" y1="336" x2="1100" y2="336" stroke="#2b3244" stroke-width="6" stroke-linecap="round"/>
    <line x1="700" y1="336" x2="900" y2="336" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="900" cy="336" r="9" fill="#ffffff"/>
