    <line x1="700" y1="392" x2="1100" y2="392" stroke="#2b3244" stroke-width="6" stroke-linecap="round"/>
    <line x1="700" y1="392" x2="900" y2="392" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
