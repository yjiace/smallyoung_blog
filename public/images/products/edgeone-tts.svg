<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e8e6ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c63ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#1e1b4b" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1100" cy="90" r="200" fill="#c7d2fe" opacity="0.35"/>
  <circle cx="90" cy="690" r="180" fill="#ddd6fe" opacity="0.45"/>

  <!-- 应用深色窗口 -->
  <g filter="url(#shadow)">
    <rect x="64" y="64" width="1072" height="622" rx="24" fill="#0b0d12"/>
  </g>
  <rect x="96" y="86" width="34" height="34" rx="10" fill="url(#accent)"/>
  <rect x="110" y="94" width="6" height="12" rx="3" fill="#ffffff"/>
  <rect x="107" y="100" width="12" height="10" rx="3" fill="#ffffff"/>
  <text x="144" y="110" font-size="20" font-weight="700" fill="#f8fafc">EdgeOne TTS</text>
  <rect x="872" y="84" width="232" height="34" rx="17" fill="#1c202d" stroke="#2b3244"/>
  <text x="892" y="106" font-size="13" fill="#a5adc2">免费在线 · 边缘节点合成</text>
  <line x1="64" y1="134" x2="1136" y2="134" stroke="#202634"/>

  <!-- 左侧：文本输入 -->
  <text x="100" y="172" font-size="14" fill="#9aa3b8">输入文本</text>
  <rect x="100" y="186" width="560" height="246" rx="16" fill="#141720" stroke="#262c3c"/>
  <text x="124" y="228" font-size="17" fill="#e8eaf3">在边缘节点上，把文字变成</text>
  <text x="124" y="258" font-size="17" fill="#e8eaf3">自然流畅的声音。</text>
  <text x="124" y="302" font-size="15" fill="#8b93a7">支持中文方言、多语言音色，以及</text>
  <text x="124" y="328" font-size="15" fill="#8b93a7">情感风格与语速、音调的细粒度调节。</text>
  <rect x="124" y="356" width="2" height="20" fill="#8b7cff"/>
  <rect x="124" y="398" width="512" height="1" fill="#262c3c"/>
  <text x="124" y="418" font-size="12" fill="#6b7488">38 字 / 5000</text>

  <text x="100" y="462" font-size="14" fill="#9aa3b8">语音角色</text>
  <rect x="100" y="476" width="560" height="52" rx="12" fill="#141720" stroke="#262c3c"/>
  <circle cx="128" cy="502" r="12" fill="#252b3c"/>
  <text x="152" y="507" font-size="14" fill="#e8eaf3">晓晓 · zh-CN-XiaoxiaoNeural</text>
  <text x="628" y="507" font-size="14" fill="#8b93a7">▾</text>

  <!-- 波形预览 -->
  <text x="100" y="548" font-size="13" fill="#6b7488">音频波形预览</text>
  <g fill="url(#wave)">
    <rect x="100" y="586" width="8" height="22" rx="4"/>
    <rect x="116" y="578" width="8" height="38" rx="4"/>
    <rect x="132" y="568" width="8" height="58" rx="4"/>
