    <rect x="260" y="572" width="8" height="50" rx="4"/>
    <rect x="276" y="586" width="8" height="22" rx="4"/>
    <rect x="292" y="564" width="8" height="66" rx="4"/>
    <rect x="308" y="578" width="8" height="38" rx="4"/>
    <rect x="324" y="554" width="8" height="86" rx="4"/>
    <rect x="340" y="570" width="8" height="54" rx="4"/>
    <rect x="356" y="584" width="8" height="26" rx="4"/>
    <rect x="372" y="562" width="8" height="70" rx="4"/>
    <rect x="388" y="576" width="8" height="42" rx="4"/>
    <rect x="404" y="588" width="8" height="18" rx="4"/>
    <rect x="420" y="566" width="8" height="62" rx="4"/>
    <rect x="436" y="580" width="8" height="34" rx="4"/>
    <rect x="452" y="558" width="8" height="78" rx="4"/>
    <rect x="468" y="574" width="8" height="46" rx="4"/>
    <rect x="484" y="586" width="8" height="22" rx="4"/>
    <rect x="500" y="568" width="8" height="58" rx="4"/>
    <rect x="516" y="580" width="8" height="34" rx="4"/>
    <rect x="532" y="562" width="8" height="70" rx="4"/>
    <rect x="548" y="576" width="8" height="42" rx="4"/>
    <rect x="564" y="588" width="8" height="18" rx="4"/>
    <rect x="580" y="570" width="8" height="54" rx="4"/>
    <rect x="596" y="584" width="8" height="26" rx="4"/>
    <rect x="612" y="566" width="8" height="62" rx="4"/>
    <rect x="628" y="580" width="8" height="34" rx="4"/>
    <rect x="644" y="590" width="8" height="14" rx="4"/>
  </g>
  <text x="100" y="664" font-size="12" fill="#6b7488">兼容 OpenAI API · 阅读 APP 朗读接口</text>

  <!-- 右侧：参数面板 -->
  <text x="700" y="172" font-size="14" fill="#9aa3b8">情感风格 · 18 种可选</text>
  <g font-size="13">
    <rect x="700" y="186" width="94" height="32" rx="10" fill="url(#accent)"/>
    <text x="726" y="207" fill="#ffffff">自然</text>
    <rect x="802" y="186" width="94" height="32" rx="10" fill="#1c202d"/>
    <text x="828" y="207" fill="#a5adc2">温柔</text>
    <rect x="904" y="186" width="94" height="32" rx="10" fill="#1c202d"/>
