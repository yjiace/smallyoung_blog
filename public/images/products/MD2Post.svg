    <text x="112" y="546" fill="#c084fc">const</text>
    <text x="152" y="546" fill="#93c5fd">hits</text>
    <text x="192" y="546" fill="#e2e8f0">= await vector.search(q);</text>
    <text x="112" y="570" fill="#7dd3fc">return</text>
    <text x="164" y="570" fill="#e2e8f0">llm.answer(hits, q);</text>
  </g>
