<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" width="140" height="40">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#137fec"/>
      <stop offset="50%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
  </defs>
  <!-- SY 组合图标背景 -->
  <rect x="2" y="6" width="28" height="28" rx="7" fill="url(#logoGradient)"/>
  <!-- S 字母 -->
  <path d="M11 15 Q11 12.5 14 12.5 L18 12.5 Q21 12.5 21 15 Q21 17.5 18 17.5 L14 17.5 Q11 17.5 11 20 Q11 22.5 14 22.5 L18 22.5 Q21 22.5 21 25" 
        stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Y 装饰点 -->
  <circle cx="24" cy="11" r="2.5" fill="url(#accentGradient)"/>
  <!-- SmallYoung 文字 -->
  <text x="36" y="27" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="currentColor">SmallYoung</text>
</svg>
